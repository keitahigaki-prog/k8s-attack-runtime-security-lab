apiVersion: v1
kind: Pod
metadata:
  name: misconfigured-pod
  namespace: lab
  labels:
    app: misconfigured-pod
spec:
  nodeSelector:
    lab-role: victim
  containers:
    - name: app
      image: alpine:3.19
      command: ["sleep", "3600"]
      securityContext:
        privileged: true
      volumeMounts:
        - name: host-root
          mountPath: /host
  volumes:
    - name: host-root
      hostPath:
        path: /
---
apiVersion: v1
kind: Pod
metadata:
  name: over-privileged-sa-pod
  namespace: lab
  labels:
    app: over-privileged-sa-pod
spec:
  serviceAccountName: deploy-bot
  nodeSelector:
    lab-role: victim
  containers:
    - name: app
      image: alpine:3.19
      command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: cap-abuse-pod
  namespace: lab
  labels:
    app: cap-abuse-pod
spec:
  nodeSelector:
    lab-role: victim
  containers:
    - name: app
      image: alpine:3.19
      command: ["sleep", "3600"]
      securityContext:
        capabilities:
          add: ["SYS_PTRACE"]
