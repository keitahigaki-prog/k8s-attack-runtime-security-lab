apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploy-bot
  namespace: lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lab-ci-overprivileged
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lab-ci-overprivileged-binding
subjects:
  - kind: ServiceAccount
    name: deploy-bot
    namespace: lab
roleRef:
  kind: ClusterRole
  name: lab-ci-overprivileged
  apiGroup: rbac.authorization.k8s.io
