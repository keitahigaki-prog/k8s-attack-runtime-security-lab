apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploy-bot
  namespace: lab
---
# Deliberately over-privileged CI service account, built up in two steps
# across the book: Lab 4 (chapter 4) only needed secrets get/list to show
# a leaked-token Secret dump. Lab 15 (chapter 8) adds pods/exec on top of
# that, to demonstrate node-to-node lateral movement with the same stolen
# token. Both permissions are included here so this manifest reflects the
# final state used from Lab 15 onward.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lab-ci-overprivileged
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lab-ci-overprivileged-binding
subjects:
  - kind: ServiceAccount
    name: deploy-bot
    namespace: lab
roleRef:
  kind: ClusterRole
  name: lab-ci-overprivileged
  apiGroup: rbac.authorization.k8s.io
