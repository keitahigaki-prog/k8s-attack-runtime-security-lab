apiVersion: v1
kind: Namespace
metadata:
  name: attacker-infra
---
apiVersion: v1
kind: Service
metadata:
  name: c2-server
  namespace: attacker-infra
spec:
  clusterIP: 10.96.99.99
  selector:
    app: c2-server
  ports:
    - port: 4444
      targetPort: 4444
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: c2-server
  namespace: attacker-infra
  labels:
    app: c2-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: c2-server
  template:
    metadata:
      labels:
        app: c2-server
    spec:
      containers:
        - name: c2
          image: busybox:1.36
          command: ["sh", "-c", "while true; do nc -lk -p 4444 -e /bin/echo 'c2-ack'; done"]
          ports:
            - containerPort: 4444
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backdoor-demo-src
  namespace: lab
data:
  entrypoint.sh: |
    #!/bin/sh
    # Simulates a backdoored image that beacons out to a C2 server on startup.
    # For Lab 2 (Initial Access / malicious image), destination is our own
    # in-cluster c2-server, not a real external host.
    echo "backdoor-demo: beaconing to C2..."
    nc -w 2 10.96.99.99 4444 </dev/null || true
    sleep 3600
---
apiVersion: v1
kind: Pod
metadata:
  name: backdoor-demo
  namespace: lab
  labels:
    app: backdoor-demo
spec:
  nodeSelector:
    lab-role: victim
  containers:
    - name: backdoor-agent
      image: busybox:1.36
      command: ["sh", "/scripts/entrypoint.sh"]
      volumeMounts:
        - name: script
          mountPath: /scripts
  volumes:
    - name: script
      configMap:
        name: backdoor-demo-src
        defaultMode: 0755
